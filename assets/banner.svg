<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="MahaArogya - Sanjeevani Grid" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="250" rx="14" fill="#0B0F14"/>

  <!-- subtle grid -->
  <g stroke="#FF9933" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 50H900M0 100H900M0 150H900M0 200H900"/>
    <path d="M100 0V250M200 0V250M300 0V250M400 0V250M500 0V250M600 0V250M700 0V250M800 0V250"/>
  </g>

  <!-- title -->
  <text x="60" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">MahaArogya</text>
  <text x="62" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#FF9933" letter-spacing="7">SANJEEVANI GRID</text>

  <!-- faint full ECG line -->
  <path id="ecg" pathLength="1000" fill="none" stroke="#FF9933" stroke-opacity="0.18" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        d="M0 195 L250 195 L290 195 L310 178 L330 195 L370 195 L395 225 L420 140 L450 235 L470 195 L560 195 L585 183 L610 195 L900 195"/>

  <!-- travelling bright pulse -->
  <path pathLength="1000" fill="none" stroke="#FF9933" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="170 830"
        d="M0 195 L250 195 L290 195 L310 178 L330 195 L370 195 L395 225 L420 140 L450 235 L470 195 L560 195 L585 183 L610 195 L900 195">
    <animate attributeName="stroke-dashoffset" from="170" to="-830" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- live dot -->
  <circle cx="842" cy="38" r="5" fill="#138808">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="830" y="43" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#9AA4AF" letter-spacing="2">LIVE</text>
</svg>
